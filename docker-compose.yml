services:
  db:
    image: postgres:16-alpine
    container_name: parts_orders_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-parts_orders}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # # Applique les migrations une fois, puis s'arrête. L'API en dépend.
  # migrate:
  #   build: .
  #   container_name: parts_orders_migrate
  #   command: ["alembic", "upgrade", "head"]
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-parts_orders}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   restart: "always"

  api:
    build: .
    container_name: parts_orders_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-parts_orders}
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      # migrate:
      #   condition: service_completed_successfully   # attend la FIN des migrations
      db:
        condition: service_healthy

  # Tests dans un conteneur, contre la base parts_orders_test.
  # Profil "test" : ne démarre que sur demande.
  test:
    build: .
    container_name: parts_orders_test
    profiles: ["test"]
    command: ["pytest", "-v"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-parts_orders}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata: